modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /
  - type: dnf
    repos:
      files:
        - terra.repo
      keys:
        - keys/terra.asc
    install:
      packages:
        - carapace
        - zellij
        - yazi
        - starship

  - from-file: bundles/base-common.yml
